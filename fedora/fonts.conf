<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <alias binding="same">
        <family>sans-serif</family>
        <prefer>
            <family>Nercone Sans CJK Variable</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>serif</family>
        <prefer>
            <family>Nercone Serif CJK Variable</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>monospace</family>
        <prefer>
            <family>Nercone Mono CJK Variable</family>
        </prefer>
    </alias>
</fontconfig>
